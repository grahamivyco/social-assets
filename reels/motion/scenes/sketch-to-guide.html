<!doctype html>
<html><head><meta charset="utf-8">
<!-- Sketch -> design file -> brand guide. Branding Reel structure studied from a studio Reel:
     pencil sketch draws on, construction guides and anchor points snap over it, the design-tool panels slide in,
     the clean vector replaces the sketch, then lockup, color versions, palette, the real brand guide pages
     (tilted grid), flat mockups with whip cuts on the beat, and an end card.
     Default client: Needlework Guild of Minnesota, using its real mark, colors, fonts and brand guide pages.
     The pencil stage is traced from the final mark. If there is a real sketch, pass PARAMS.sketch (an image path)
     and it is used instead. Don't caption the traced version as the original sketch. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Sans:wght@500&display=block">
<style>
  /* Open Frame sign-off: Helvetica Neue Bold, upright, accent by color (2026-11-03); Liberation Sans on Linux */
  @font-face { font-family: OFr; src: local("Helvetica Neue Bold"), local("HelveticaNeue-Bold"), local("Helvetica Bold"), local("Arial Bold"), local("Liberation Sans Bold"); font-weight: 700; }
  @font-face { font-family: In; src: url(../../editor/fonts/Inter-SemiBold.otf); }
  :root { --sage: #3E5538; --mid: #5C7A52; --pale: #EEF3EC; --rose: #B87260; --cream: #FAF7F2; --linen: #F0EAE0; --ink: #242424; --ui: #0D99FF; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--linen); }
  .abs { position: absolute; }
  .full { position: absolute; inset: 0; }
  #paper { background: var(--linen); }
  #canvasBg { background: #E7E4DE; opacity: 0; }
  #art { position: absolute; left: 188px; top: 576px; width: 740px; height: 780px; transform-origin: 352px 384px; } /* mark's drawn center sits on 540,960 */
  #mk { width: 740px; height: 780px; overflow: visible; }
  /* design tool chrome: flat panels, no brand marks */
  .panel { position: absolute; background: #FFFFFF; font: 600 22px/1 In; color: #2C2C2C; }
  #top { left: 0; right: 0; top: 0; height: 120px; display: flex; align-items: flex-end; gap: 22px; padding: 0 30px 26px; box-sizing: border-box; }
  #top i { display: block; width: 44px; height: 44px; border-radius: 10px; background: #EFEFEF; }
  #top i.on { background: var(--ui); }
  #top b { margin-left: auto; font-size: 22px; color: #777; }
  #left { left: 0; top: 120px; bottom: 0; width: 250px; padding-top: 34px; }
  #right { right: 0; top: 120px; bottom: 0; width: 250px; padding: 34px 26px; box-sizing: border-box; }
  .row { height: 62px; display: flex; align-items: center; padding-left: 26px; gap: 14px; font-size: 22px; }
  .row.sub { padding-left: 54px; }
  .row.sel { background: #E5F4FF; }
  .row s { width: 18px; height: 18px; border-radius: 4px; background: #CFCFCF; text-decoration: none; }
  .lab { font-size: 18px; color: #8A8A8A; letter-spacing: 1px; margin: 0 0 18px; text-transform: uppercase; }
  .sw { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; font-size: 21px; }
  .sw s { width: 40px; height: 40px; border-radius: 8px; }
  #tag { position: absolute; background: var(--ui); color: #fff; font: 600 22px/1 In; padding: 9px 14px; border-radius: 8px; white-space: nowrap; }
  /* brand */
  .lock { position: absolute; display: flex; align-items: center; gap: 34px; white-space: nowrap; }
  .lock svg { overflow: visible; }
  .wm b { display: block; font: 500 98px/1 'Cormorant Garamond'; letter-spacing: -1px; }
  .wm em { display: block; font: 500 33px/1 'DM Sans'; font-style: normal; letter-spacing: 9px; margin-top: 16px; }
  .band { position: absolute; left: 0; width: 1080px; height: 480px; overflow: hidden; }
  .bar { position: absolute; bottom: 0; }
  .bar p { position: absolute; left: 22px; bottom: 470px; margin: 0; font: 500 26px/1.3 'DM Sans'; }
  #grid { position: absolute; left: 540px; top: 960px; width: 0; height: 0; perspective: 2600px; }
  #plane { position: absolute; transform-style: preserve-3d; }
  #plane img { position: absolute; width: 467px; height: 605px; border-radius: 6px; }
  #whip .mock { position: absolute; left: 0; top: 0; transform-origin: 540px 960px; }
  #end .big { position: absolute; right: -260px; bottom: -200px; width: 1000px; opacity: .1; }
  #end p { position: absolute; left: 0; right: 0; top: 1240px; text-align: center; font: 500 26px/1 'DM Sans'; letter-spacing: 6px; text-transform: uppercase; color: var(--cream); opacity: .7; margin: 0; }
  #flash { background: #fff; opacity: 0; }
  #fadeIn { background: var(--ink); }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.35" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="0.5" height="0.5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="0.5" stroke="#6E6A63" stroke-width="0.1"/>
    </pattern>
    <symbol id="M" viewBox="-3 -3 37 39" overflow="visible"><use href="#thread" fill="none" style="stroke:var(--t)" stroke-width="1.10903" stroke-linecap="round"/><use href="#needle" style="fill:var(--n)"/></symbol>
    <filter id="hblur" x="-30%" y="0" width="160%" height="100%"><feGaussianBlur id="hb" stdDeviation="0 0"/></filter>
  </defs>
</svg>

<div class="full" id="paper"></div>
<div class="full" id="canvasBg"></div>

<div id="art">
  <svg id="mk" viewBox="-3 -3 37 39">
    <defs>
      <path id="thread" d="M28.5547 7.44547C26.2681 9.13737 25.721 5.92628 22.5099 6.92791C19.2989 7.92953 17.5135 3.98848 15.3588 4.91173C8.69503 7.76718 8.3302 -0.592457 10.5295 0.689564C12.7288 1.97158 9.43716 5.04174 3.59451 2.8711C-2.24814 0.700455 1.98638 9.17239 2.77963 12.1143C3.57287 15.0563 4.59607 17.9819 3.34335 18.7705C2.09063 19.5592 1.98055 21.0184 3.59389 21.9567C5.20724 22.8949 3.06149 29.717 3.75048 31.2627C4.43948 32.8085 22.5099 32.8715 23.2929 31.2627C25.0116 27.7311 18.3781 28.5168 17.9688 25.4583C17.7861 24.0923 18.5862 23.3231 18.4073 21.9567C18.292 21.0757 17.6044 20.6564 17.7496 19.78C17.9432 18.6113 19.5185 18.7835 19.9106 17.6664C20.262 16.6651 19.3568 15.9495 19.7226 14.9535C20.198 13.6594 21.7581 14.3958 22.5099 12.8083C23.2618 11.2209 23.9468 10.4799 26.2681 9.77992"/>
      <path id="needle" d="M20.9651 5.25056L4.17261 31.89L18.68 3.92169C18.9674 3.36764 19.7428 3.22016 20.3898 3.59646C21.0369 3.97276 21.2977 4.72284 20.9651 5.25056ZM19.3148 4.29165L18.1796 6.2722C18.0453 6.50659 18.1635 6.82871 18.4437 6.99168C18.724 7.15465 19.0601 7.09675 19.1944 6.86236L20.3296 4.88181C20.464 4.64742 20.3457 4.3253 20.0655 4.16233C19.7852 3.99936 19.4492 4.05726 19.3148 4.29165Z"/>
      <clipPath id="needleClip"><use href="#needle"/></clipPath>
    </defs>
    <g id="sketch" filter="url(#pencil)" fill="none" stroke="#5F5B55" stroke-linecap="round" stroke-linejoin="round">
      <rect id="hatchFill" x="-3" y="-3" width="37" height="39" fill="url(#hatch)" clip-path="url(#needleClip)" stroke="none" opacity="0"/>
      <path class="pen" data-src="thread" stroke-width="0.22"/>
      <path class="pen" data-src="needle" stroke-width="0.18"/>
      <path class="pen2" data-src="thread" stroke-width="0.09" transform="translate(0.22 -0.14)" opacity=".45"/>
      <path class="pen2" data-src="needle" stroke-width="0.08" transform="translate(-0.12 0.18)" opacity=".45"/>
    </g>
    <image id="sketchImg" x="-3" y="-3" width="37" height="39" preserveAspectRatio="xMidYMid meet" opacity="0"/>
    <g id="vec">
      <path id="vThread" data-src="thread" fill="none" stroke="#B87260" stroke-width="1.10903" stroke-linecap="round"/>
      <path id="vNeedle" data-src="needle" fill="#3E5538" transform-origin="12.5 17.5"/>
    </g>
    <g id="guides" fill="none" stroke="#0D99FF"></g>
  </svg>
</div>

<div id="tag">Mark · 37 × 39</div>
<div class="panel" id="top"><i class="on"></i><i></i><i></i><i></i><i></i><b>NGM brand</b></div>
<div class="panel" id="left">
  <div class="row"><s></s>Frame</div>
  <div class="row sub" id="rowMark"><s></s>Mark</div>
  <div class="row sub" id="rowThread" style="padding-left:80px"><s style="background:#B87260"></s>Thread</div>
  <div class="row sub" id="rowNeedle" style="padding-left:80px"><s style="background:#3E5538"></s>Needle</div>
</div>
<div class="panel" id="right">
  <p class="lab">Fill</p>
  <div class="sw"><s style="background:#3E5538"></s>3E5538</div>
  <div class="sw"><s style="background:#B87260"></s>B87260</div>
  <p class="lab" style="margin-top:34px">Stroke</p>
  <div class="sw"><s style="background:#B87260"></s>1.11 round</div>
</div>

<!-- lockup on cream -->
<div class="full" id="lockScene" style="background:var(--cream);opacity:0">
  <div class="lock" id="lock" style="left:540px;top:960px">
    <svg id="lockMark" width="170" height="179" viewBox="-3 -3 37 39"><use href="#thread" fill="none" stroke="#B87260" stroke-width="1.10903" stroke-linecap="round"/><use href="#needle" fill="#3E5538"/></svg>
    <div class="wm" id="wm"><b style="color:var(--ink)">Needlework Guild</b><em style="color:var(--rose)">OF MINNESOTA</em></div>
  </div>
</div>

<!-- color versions: four bands -->
<div class="full" id="bands" style="opacity:0"></div>
<!-- palette bars -->
<div class="full" id="bars" style="opacity:0;background:var(--cream)"></div>
<!-- guide pages, tilted grid -->
<div class="full" id="gridScene" style="background:var(--sage);opacity:0"><div id="grid"><div id="plane"></div></div></div>
<!-- mockups, whip cuts on the beat -->
<div class="full" id="whip" style="background:var(--pale);opacity:0;filter:url(#hblur)"></div>
<!-- end card -->
<div class="full" id="end" style="background:var(--sage);opacity:0">
  <svg class="big" viewBox="-3 -3 37 39"><use href="#thread" fill="none" stroke="#FAF7F2" stroke-width="1.10903" stroke-linecap="round"/><use href="#needle" fill="#FAF7F2"/></svg>
  <div class="lock" id="endLock" style="left:540px;top:900px">
    <svg width="150" height="158" viewBox="-3 -3 37 39"><use href="#thread" fill="none" stroke="#B87260" stroke-width="1.10903" stroke-linecap="round"/><use href="#needle" fill="#FAF7F2"/></svg>
    <div class="wm"><b style="color:var(--cream);font-size:86px">Needlework Guild</b><em style="color:#F5EBE7;font-size:29px">OF MINNESOTA</em></div>
  </div>
  <p id="credit">Brand kit by Open Frame</p>
</div>
<!-- Open Frame sign-off: the question -->
<div class="full" id="of" style="background:#111110;opacity:0">
  <svg id="ofMark" width="200" height="200" viewBox="0 0 120 120" style="position:absolute;left:440px;top:560px;overflow:visible">
    <path id="ofFrame" d="M74 22 H36 A14 14 0 0 0 22 36 V84 A14 14 0 0 0 36 98 H84 A14 14 0 0 0 98 84 V48" fill="none" stroke="#F3F1EA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="ofSpark"><path d="M0 -50 C0 -21 21 0 50 0 C21 0 0 21 0 50 C0 21 -21 0 -50 0 C-21 0 0 -21 0 -50 Z" fill="#F3F1EA"/></g>
  </svg>
  <div id="ofQ" style="position:absolute;left:0;right:0;top:850px;text-align:center;font:700 104px/1.04 OFr;letter-spacing:-3px;color:#F3F1EA"></div>
  <div id="ofCta" style="position:absolute;left:0;right:0;top:1150px;text-align:center;font:600 34px/1.4 In;color:#F3F1EA"></div>
</div>
<div class="full" id="flash"></div>
<div class="full" id="fadeIn"></div>

<script src="../lib.js"></script>
<script src="mockups-ngm.js"></script>
<script>
const P = Object.assign({ sketch: null, pages: [1, 2, 3, 4, 5].map(n => `../assets/ngm/page-${n}.jpg`), credit: 'Brand kit by Open Frame', tag: 'Mark', question: 'Want your brand<br>to be <i>next?</i>', cta: 'Book a free consult<br><span style="opacity:.6">openframe.design/links</span>' }, window.PARAMS || {});
const { tw, prog, clamp, lerp, spring, $, $$, css } = M;
$('#credit').textContent = P.credit;
$('#ofQ').innerHTML = P.question.replace(/<i>/g, '<i style="font-style:normal;color:#F24333">'); $('#ofCta').innerHTML = P.cta;
$$('[data-src]').forEach(e => e.setAttribute('d', document.getElementById(e.dataset.src).getAttribute('d')));
const LEN = new Map(); const draw = (e, k) => { if (!LEN.has(e)) LEN.set(e, e.getTotalLength()); const L = LEN.get(e); e.setAttribute('stroke-dasharray', `${L} ${L}`); e.setAttribute('stroke-dashoffset', L * (1 - k)); };
if (P.sketch) { $('#sketchImg').setAttribute('href', P.sketch); $('#sketch').style.display = 'none'; }

// timeline (seconds). Roughly on a 117 BPM grid so a trending sound lines up.
const S = { paper: 0, pen: 0.35, penEnd: 2.9, guide: 2.9, ui: 4.1, vec: 4.9, vecEnd: 6.1, lock: 6.4, wm: 7.0, bands: 8.3, bars: 9.6, grid: 10.9, whip: 12.9, end: 17.25, of: 18.9, dur: 22.2 };
const WHIP = 0.513;  // one beat per page

// construction guides + anchor points, built once
const G = $('#guides'), NS = 'http://www.w3.org/2000/svg';
const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); G.appendChild(e); return e; };
const bb = { x: 0.6, y: 0.1, w: 28.6, h: 32.3 };
const lines = [
  el('line', { x1: -40, y1: bb.y, x2: 70, y2: bb.y, 'stroke-width': 0.09 }),
  el('line', { x1: -40, y1: bb.y + bb.h, x2: 70, y2: bb.y + bb.h, 'stroke-width': 0.09 }),
  el('line', { x1: bb.x, y1: -40, x2: bb.x, y2: 75, 'stroke-width': 0.09 }),
  el('line', { x1: bb.x + bb.w, y1: -40, x2: bb.x + bb.w, y2: 75, 'stroke-width': 0.09 }),
  el('line', { x1: 4.17, y1: 31.89, x2: 21.2, y2: 4.9, 'stroke-width': 0.09, 'stroke-dasharray': '0.5 0.3' }),
];
const box = el('rect', { x: bb.x, y: bb.y, width: bb.w, height: bb.h, 'stroke-width': 0.13 });
const handles = [[bb.x, bb.y], [bb.x + bb.w, bb.y], [bb.x, bb.y + bb.h], [bb.x + bb.w, bb.y + bb.h]].map(([x, y]) => el('rect', { x: x - 0.45, y: y - 0.45, width: 0.9, height: 0.9, fill: '#fff', 'stroke-width': 0.12 }));
const tpath = document.getElementById('thread'), TL = tpath.getTotalLength();
const anchors = Array.from({ length: 16 }, (_, i) => { const p = tpath.getPointAtLength((TL * (i + 0.5)) / 16); return el('circle', { cx: p.x, cy: p.y, r: 0.32, fill: '#fff', 'stroke-width': 0.12 }); });
const hpairs = [2, 5, 8, 11, 14].map(i => { const a = tpath.getPointAtLength((TL * (i + 0.5)) / 16), b = tpath.getPointAtLength((TL * (i + 0.5)) / 16 + 0.9), c = tpath.getPointAtLength((TL * (i + 0.5)) / 16 - 0.9); const dx = (b.x - c.x) * 1.4, dy = (b.y - c.y) * 1.4; return el('line', { x1: a.x - dx, y1: a.y - dy, x2: a.x + dx, y2: a.y + dy, 'stroke-width': 0.08 }); });

// color version bands
const BANDS = [
  { bg: '#FAF7F2', t: '#242424', s: '#B87260', n: '#3E5538' },
  { bg: '#3E5538', t: '#FAF7F2', s: '#F5EBE7', n: '#FAF7F2' },
  { bg: '#EEF3EC', t: '#3E5538', s: '#B87260', n: '#3E5538' },
  { bg: '#B87260', t: '#FAF7F2', s: '#FAF7F2', n: '#FAF7F2' },
];
$('#bands').innerHTML = BANDS.map((b, i) => `<div class="band" style="top:${i * 480}px;background:${b.bg}"><div class="lock" style="left:540px;top:240px;transform:translate(-50%,-50%) scale(.62)"><svg width="170" height="179" viewBox="-3 -3 37 39"><use href="#thread" fill="none" stroke="${b.s}" stroke-width="1.10903" stroke-linecap="round"/><use href="#needle" fill="${b.n}"/></svg><div class="wm"><b style="color:${b.t}">Needlework Guild</b><em style="color:${b.s}">OF MINNESOTA</em></div></div></div>`).join('');
// palette bars
const PAL = [['Sage', '#3E5538', '#FAF7F2'], ['Mid sage', '#5C7A52', '#FAF7F2'], ['Pale sage', '#EEF3EC', '#3E5538'], ['Rose', '#B87260', '#FAF7F2'], ['Linen', '#F0EAE0', '#3E5538'], ['Ink', '#242424', '#FAF7F2']];
$('#bars').innerHTML = PAL.map(([n, h, t], i) => `<div class="bar" style="left:${i * 180}px;width:180px;height:1920px;background:${h};color:${t}"><p>${n}<br>${h}</p></div>`).join('');
// tilted grid of the real brand guide pages
let gi = 0, ghtml = '';
for (let r = -3; r <= 3; r++) for (let c = -3; c <= 3; c++) { ghtml += `<img src="${P.pages[(gi++) % P.pages.length]}" style="left:${c * 500 - 233}px;top:${r * 640 - 302}px">`; }
$('#plane').innerHTML = ghtml;
$('#whip').innerHTML = MOCKUPS.map(f => f()).join('');

window.SCENE = {
  dur: S.dur, ready: false,
  seek(t) {
    // 0. open from ink
    css('#fadeIn', { opacity: 1 - prog(t, 0, 0.4, 'outCubic') });

    // 1. pencil sketch draws on, slow push in
    const pen = prog(t, S.pen, S.penEnd - 0.4, 'inOutSine');
    $$('.pen').forEach((u, i) => draw(u, prog(t, S.pen + i * 0.5, S.penEnd - 0.6 + i * 0.2, 'inOutSine')));
    $$('.pen2').forEach((u, i) => draw(u, prog(t, S.pen + 0.5 + i * 0.4, S.penEnd - 0.2, 'inOutSine')));
    $('#hatchFill').setAttribute('opacity', 0.9 * prog(t, S.penEnd - 0.9, S.penEnd, 'outCubic'));
    $('#sketchImg').setAttribute('opacity', P.sketch ? prog(t, S.pen, S.pen + 0.6) : 0);

    // 2. construction guides snap on
    lines.forEach((l, i) => { if (i < 4) draw(l, prog(t, S.guide + i * 0.08, S.guide + 0.45 + i * 0.08, 'outExpo')); l.setAttribute('opacity', i === 4 ? prog(t, S.guide + 0.5, S.guide + 0.7) : 1); });
    draw(box, prog(t, S.guide + 0.3, S.guide + 0.8, 'outExpo'));
    handles.forEach((h, i) => { const k = M.E.outBack(prog(t, S.guide + 0.7 + i * 0.05, S.guide + 0.95 + i * 0.05)); h.setAttribute('transform', `translate(${h.x.baseVal.value + 0.45} ${h.y.baseVal.value + 0.45}) scale(${k}) translate(${-h.x.baseVal.value - 0.45} ${-h.y.baseVal.value - 0.45})`); });
    anchors.forEach((a, i) => a.setAttribute('r', 0.32 * M.E.outBack(prog(t, S.guide + 0.5 + i * 0.04, S.guide + 0.75 + i * 0.04))));
    hpairs.forEach((h, i) => h.setAttribute('opacity', prog(t, S.guide + 1.0 + i * 0.06, S.guide + 1.2 + i * 0.06)));
    const guidesOut = prog(t, S.vecEnd - 0.3, S.vecEnd, 'outCubic');
    G.setAttribute('opacity', 1 - guidesOut);

    // 3. design tool panels slide in, the art scales down to sit on the canvas
    const ui = prog(t, S.ui, S.ui + 0.6, 'outExpo'), uiOut = prog(t, S.vecEnd, S.vecEnd + 0.35, 'inExpo');
    css('#top', { transform: `translateY(${lerp(-130, 0, ui) - 130 * uiOut}px)` });
    css('#left', { transform: `translateX(${lerp(-260, 0, ui) - 260 * uiOut}px)` });
    css('#right', { transform: `translateX(${lerp(260, 0, ui) + 260 * uiOut}px)` });
    css('#canvasBg', { opacity: ui * (1 - uiOut) });
    const push = lerp(1, 1.07, prog(t, 0, S.ui, 'linear'));
    const sc = lerp(push, 0.6, ui) * lerp(1, 1 / 0.6, uiOut * 0);
    css('#art', { transform: `scale(${sc})` });
    // tag above the box follows the scale
    const tagK = prog(t, S.guide + 0.8, S.guide + 1.0, 'outExpo') * (1 - guidesOut);
    const top = 576 + 384 - 384 * sc + (bb.y + 3) * 20 * sc - 54;
    css('#tag', { left: (188 + 352 - 352 * sc + (bb.x + 3) * 20 * sc) + 'px', top: top + 'px', opacity: tagK, transform: `scale(${lerp(0.6, 1, tagK)})`, transformOrigin: '0 100%' });

    // 4. clean vector replaces the sketch
    const th = prog(t, S.vec, S.vec + 0.7, 'outExpo');
    draw($('#vThread'), th);
    const nk = spring(t, S.vec + 0.45, 2.4, 6);
    $('#vNeedle').setAttribute('transform', `scale(${t < S.vec + 0.45 ? 0 : nk})`);
    css('#sketch', { opacity: 1 - prog(t, S.vec + 0.2, S.vec + 0.8) });
    $('#rowThread').className = 'row sub' + (t > S.vec && t < S.vec + 0.45 ? ' sel' : '');
    $('#rowNeedle').className = 'row sub' + (t >= S.vec + 0.45 && t < S.vecEnd ? ' sel' : '');
    $('#rowMark').className = 'row sub' + (t >= S.ui && t < S.vec ? ' sel' : '');

    // 5. flash through white into the lockup on cream
    const fl = t < S.lock ? prog(t, S.lock - 0.3, S.lock, 'inCubic') : 1 - prog(t, S.lock, S.lock + 0.5, 'outCubic');
    css('#flash', { opacity: fl });
    css('#lockScene', { opacity: t >= S.lock ? 1 : 0 });
    // mark starts centered and big, slides left as the name wipes in
    const wmK = prog(t, S.wm, S.wm + 0.7, 'inOutExpo');
    const lockW = $('#lock').offsetWidth;
    css('#wm', { clipPath: `inset(0 ${100 - 100 * prog(t, S.wm + 0.2, S.wm + 0.9, 'outExpo')}% 0 0)` });
    const markOnlyShift = (lockW - 2 * 80.9) / 2;  // 80.9 = drawn center of the mark inside its 170px box
    const s5 = lerp(2.6, 0.8, wmK);
        css('#lock', { transform: `translate(-50%,-50%) translateX(${lerp(markOnlyShift * s5, 0, wmK)}px) scale(${s5})` });

    // 6. color versions, bands slide in from alternating sides on the beat
    css('#bands', { opacity: t >= S.bands ? 1 : 0 });
    $$('#bands .band').forEach((b, i) => { const k = prog(t, S.bands + i * 0.13, S.bands + 0.5 + i * 0.13, 'outExpo'); b.style.transform = `translateX(${(1 - k) * (i % 2 ? 1080 : -1080)}px)`; });

    // 7. palette bars rise in a stagger
    css('#bars', { opacity: t >= S.bars ? 1 : 0 });
    $$('#bars .bar').forEach((b, i) => { const k = prog(t, S.bars + i * 0.07, S.bars + 0.55 + i * 0.07, 'outExpo'); b.style.transform = `translateY(${(1 - k) * 1920}px)`; });

    // 8. real brand guide pages on a tilted plane, camera drifts across
    css('#gridScene', { opacity: t >= S.grid ? 1 : 0 });
    const g = prog(t, S.grid, S.whip, 'linear'), gin = prog(t, S.grid, S.grid + 0.6, 'outExpo');
    css('#plane', { transform: `rotateX(52deg) rotateZ(-32deg) translate(${lerp(-200, 260, g)}px, ${lerp(500, -300, g)}px) scale(${lerp(1.6, 1, gin)})` });

    // 9. mockups: one per beat, whip in from the right with horizontal motion blur, slow push in while held
    css('#whip', { opacity: t >= S.whip ? 1 : 0 });
    let blur = 0;
    const mocks = $$('#whip .mock'), nM = mocks.length;
    mocks.forEach((im, i) => {
      const a = S.whip + i * WHIP;                     // this mockup lands at a
      const kin = i === 0 ? 1 : prog(t, a - 0.16, a + 0.06, 'outExpo');
      const kout = i < nM - 1 ? prog(t, a + WHIP - 0.16, a + WHIP + 0.06, 'inExpo') : 0;
      const x = (1 - kin) * 1080 - 1080 * kout;
      const push = 1 + 0.06 * prog(t, a - 0.1, a + WHIP + 0.1, 'linear');
      im.style.transform = `translateX(${x}px) scale(${push})`;
      im.style.visibility = t > a - 0.2 && t < a + WHIP + 0.1 || (i === nM - 1 && t >= a) ? 'visible' : 'hidden';
      if (i > 0 && t > a - 0.16 && t < a + 0.06) blur = Math.max(blur, 55 * (1 - Math.abs((t - (a - 0.05)) / 0.12)));
    });
    $('#hb').setAttribute('stdDeviation', `${Math.max(0, blur)} 0`);

    // 10. end card
    const e = prog(t, S.end, S.end + 0.5, 'outExpo');
    css('#end', { opacity: t >= S.end ? 1 : 0 });
    css('#endLock', { transform: `translate(-50%,-50%) scale(${lerp(0.62, 0.7, e)})`, opacity: e });
    css('#end .big', { transform: `translate(${lerp(120, 0, e)}px, ${lerp(120, 0, e)}px)` });
    css('#credit', { opacity: 0.7 * prog(t, S.end + 0.5, S.end + 0.9) });

    // 11. Open Frame sign-off: guild card slides up, the frame draws on, the sparkle pops, then the question
    const o = prog(t, S.of - 0.05, S.of + 0.45, 'inOutExpo');
    css('#end', { transform: `translateY(${-1920 * o}px)` });
    css('#of', { opacity: t >= S.of - 0.05 ? 1 : 0, transform: `translateY(${1920 * (1 - o)}px)` });
    const ofr = $("#ofFrame"), ofl = 265;
    ofr.setAttribute("stroke-dasharray", `${ofl} ${ofl}`); ofr.setAttribute("stroke-dashoffset", ofl * (1 - prog(t, S.of + 0.3, S.of + 0.9, 'inOutCubic')));
    const spk = t < S.of + 0.75 ? 0 : M.spring(t, S.of + 0.75, 2.4, 6);
    $('#ofSpark').setAttribute('transform', `translate(60,60) scale(${0.42 * spk}) rotate(${90 * prog(t, S.of + 0.75, S.of + 1.3, 'outExpo')})`);
    css('#ofQ', { opacity: prog(t, S.of + 0.9, S.of + 1.2), transform: `translateY(${lerp(30, 0, prog(t, S.of + 0.9, S.of + 1.4, 'outExpo'))}px)` });
    css('#ofCta', { opacity: prog(t, S.of + 1.4, S.of + 1.7) });
  },
};
Promise.all(['500 98px "Cormorant Garamond"', 'italic 500 98px "Cormorant Garamond"', '500 33px "DM Sans"', '600 22px In', '700 104px OFr'].map(f => document.fonts.load(f)))
  .then(() => Promise.all($$('img').map(i => i.decode().catch(() => {}))))
  .then(() => { SCENE.ready = true; SCENE.seek(0); });
</script>
