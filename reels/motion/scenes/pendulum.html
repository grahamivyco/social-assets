<!doctype html>
<html><head><meta charset="utf-8">
<!-- Pendulum wipe. A red dot on a string swings across the frame. Left of the dot you see the answer,
     right of it the question, so every swing trades "Need a ...?" for the answer, and the dot lands as the
     answer's full stop. On the last swing it sticks, the string pulls away, and the mark comes up.
     Technique studied from a kinetic type Reel (one shot, no cuts); words, type, colors and mark are Open Frame's.
     PARAMS: questions[], answer, final, line, bg, fg, dot -->
<style>
  @font-face { font-family: Fr; src: url(../../editor/fonts/Fraunces_600SemiBold.ttf); }
  @font-face { font-family: In; src: url(../../editor/fonts/Inter-SemiBold.otf); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); }
  .layer { position: absolute; inset: 0; }
  .ans, .q { position: absolute; left: 0; width: 1080px; text-align: center; }
  .ans span { font: 600 188px/1 Fr; letter-spacing: -4px; white-space: nowrap; }
  .q { font: 600 70px/1.08 In; letter-spacing: -1px; opacity: .55; }
  #lock { position: absolute; left: 0; width: 1080px; top: 1215px; text-align: center; transform-origin: 50% 0; }
  #lock svg { width: 96px; height: 96px; display: block; margin: 0 auto 26px; }
  #lock div { font: 600 26px/1 In; letter-spacing: 5px; text-transform: uppercase; opacity: .5; }
  svg#rig { position: absolute; inset: 0; overflow: visible; }
</style></head>
<body>
  <div class="layer" id="qL"><div class="q" id="q"></div></div>
  <div class="layer" id="aL"><div class="ans" id="a"><span id="aw"></span></div></div>
  <svg id="rig" width="1080" height="1920"><line id="str" stroke-width="2.5" stroke-linecap="round"/><circle id="dot"/></svg>
  <div id="lock">
    <svg viewBox="0 0 120 120"><path d="M74 22 H36 A14 14 0 0 0 22 36 V84 A14 14 0 0 0 36 98 H84 A14 14 0 0 0 98 84 V48" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(60,60) scale(0.42)"><path d="M0 -50 C0 -21 21 0 50 0 C21 0 0 21 0 50 C0 21 -21 0 -50 0 C-21 0 0 -21 0 -50 Z" fill="currentColor"/></g></svg>
    <div id="line"></div>
  </div>
<script src="../lib.js"></script>
<script>
const P = Object.assign({
  questions: ['Need a brand?', 'Need a website?', 'Need posts?', 'Need a plan?', 'Need all of it?'],
  answer: 'Handled', final: "Let's talk", line: 'Design and marketing',
  bg: '#111110', fg: '#F3F1EA', dot: '#F24333',
}, window.PARAMS || {});
const { tw, prog, clamp, lerp, $, css } = M;
document.documentElement.style.setProperty('--bg', P.bg);
document.documentElement.style.setProperty('--fg', P.fg);
$('#line').textContent = P.line;
$('#str').setAttribute('stroke', P.fg); $('#str').setAttribute('stroke-opacity', '.35');
$('#dot').setAttribute('fill', P.dot);

const BASE = 930, R = 25, AY = -950;      // text baseline, dot radius, pendulum pivot (off screen)
const T = 2.4;                              // one full swing, left -> right -> left
const N = P.questions.length;
const END = N * T - T / 2;                  // the last right-hand stop: dot becomes the full stop
const DUR = END + 3.4;
let geo = {};

function measure(word) {
  $('#aw').textContent = word;
  const r = $('#aw').getBoundingClientRect();
  const xR = r.right + R + 2, xL = r.left - 70, cx = (xL + xR) / 2;
  return { cx, half: (xR - xL) / 2 };
}

function bob(t) {
  // pendulum angle: starts at the left stop, cosine swing (true pendulum timing, slow at the ends)
  const tt = Math.min(t, END);
  const k = Math.floor(tt / T);
  const last = tt >= (N - 1) * T;           // the final swing grows/shrinks to fit the final word
  const g = last ? { cx: lerp(geo.a.cx, geo.f.cx, prog(tt, (N - 1) * T, END, 'inOutSine')), half: lerp(geo.a.half, geo.f.half, prog(tt, (N - 1) * T, END, 'inOutSine')) } : geo.a;
  const L = BASE - R - AY + 40;
  const th = Math.asin(g.half / L) * -Math.cos((2 * Math.PI * tt) / T);
  const x = g.cx + L * Math.sin(th);
  const yTop = AY + L * Math.cos(Math.asin(g.half / L));   // height at the stops
  const y = AY + L * Math.cos(th) - (yTop - (BASE - R + 6)); // stops sit on the baseline, like a full stop
  return { x, y };
}

window.SCENE = {
  dur: DUR, ready: false,
  seek(t) {
    const { x, y } = bob(t);
    // which question and which answer are showing. Swaps happen while each is fully hidden.
    const qi = clamp(Math.floor((t + T / 2) / T), 0, N - 1);
    $('#q').innerHTML = P.questions[qi].replace(/^(\S+)\s/, '$1<br>');
    const qh = $('#q').getBoundingClientRect().height;
    css('#q', { top: (BASE - 70 - qh / 2) + 'px' });
    const finalWord = t >= (N - 1) * T;
    $('#aw').textContent = finalWord ? P.final : P.answer;
    css('#a', { top: (BASE - 150) + 'px' });
    css('#aL', { clipPath: `inset(0 ${1080 - x}px 0 0)` });
    css('#qL', { clipPath: `inset(0 0 0 ${x}px)` });

    // string: after the last stop its top end drops onto the dot and is gone
    const pull = prog(t, END + 0.25, END + 0.6, 'inExpo');
    const L = BASE - R - AY + 40, sx = geo.a.cx, sy = AY;
    const tx = lerp(sx, x, pull), ty = lerp(sy, y, pull);
    css('#str', { opacity: pull >= 1 ? 0 : 1 });
    ['x1', 'y1', 'x2', 'y2'].forEach((a, i) => $('#str').setAttribute(a, [tx, ty, x, y][i]));
    // dot: tiny squash when it lands for good
    const land = M.spring(t, END + 0.6, 2.6, 7);
    const s = t > END + 0.6 ? 1 + 0.18 * (1 - land) : 1;
    $('#dot').setAttribute('cx', x); $('#dot').setAttribute('cy', y);
    $('#dot').setAttribute('r', R * s);

    // lockup: steady through the swings, then eases up and grows a touch (the sign-off)
    const up = prog(t, END + 0.7, END + 1.6, 'outExpo');
    css('#lock', { transform: `translateY(${lerp(0, -40, up)}px) scale(${lerp(1, 1.18, up)})`, opacity: tw(t, 0, 0.4, 0, 1) });
    css(document.body, { opacity: 1 });
  },
};
Promise.all([document.fonts.load('600 188px Fr'), document.fonts.load('600 70px In')]).then(() => { geo.a = measure(P.answer); geo.f = measure(P.final); SCENE.ready = true; SCENE.seek(0); });
</script>
</body></html>
