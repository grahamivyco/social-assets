<!doctype html>
<html><head><meta charset="utf-8">
<!-- Frame flip (Open Frame), v3 (Graham, 2026-11-03): a thin rectangle outline holds the words. The sparkle sweeps
     side to side across it, and the next line (question, then its answer) is revealed behind it as it passes. At the
     end the rectangle shrinks into the Open Frame mark: its top-right corner opens and the sparkle settles in the
     middle, so the logo is fixed. Then the free consult.
     PARAMS: pairs [[question, answer], ...], cta, link -->
<style>
  /* Open Frame headings: Helvetica Neue Bold, upright. A macOS system font, so loaded by name; Liberation Sans on Linux */
  @font-face { font-family: Fr; src: local("Helvetica Neue Bold"), local("HelveticaNeue-Bold"), local("Helvetica Bold"), local("Arial Bold"), local("Liberation Sans Bold"); font-weight: 700; }
  @font-face { font-family: In; src: url(../../editor/fonts/Inter-SemiBold.otf); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #111110; }
  svg { position: absolute; inset: 0; overflow: visible; }
  .txt { position: absolute; left: 540px; top: 900px; width: 600px; transform: translate(-50%, -50%); text-align: center; text-wrap: balance; font: 700 96px/1.02 Fr; letter-spacing: -3px; }
  #cta { position: absolute; left: 0; right: 0; top: 1130px; text-align: center; font: 700 76px/1.05 Fr; color: #F3F1EA; letter-spacing: -2px; }
  #link { position: absolute; left: 0; right: 0; top: 1240px; text-align: center; font: 600 30px/1 In; color: #F3F1EA; letter-spacing: .5px; }
</style></head>
<body>
<div class="txt" id="t0"></div><div class="txt" id="t1"></div>
<svg width="1080" height="1920"><path id="frame" fill="none" stroke="#F3F1EA" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="spark"><path d="M0 -50 C0 -21 21 0 50 0 C21 0 0 21 0 50 C0 21 -21 0 -50 0 C-21 0 0 -21 0 -50 Z"/></g></svg>
<div id="cta"></div><div id="link"></div>
<script src="../lib.js"></script>
<script>
const P = Object.assign({
  pairs: [
    ['Need a brand?', 'Let’s make it look like you.'],
    ['Need a website?', 'We’ll design it and build it.'],
    ['Posts piling up?', 'We plan the month with you.'],
    ['Want it all to match?', 'That’s the whole idea.'],
  ],
  cta: 'Book a free consult', link: 'openframe.design',
}, window.PARAMS || {});
const { prog, lerp, $, css, E } = M;
const CREAM = '#F3F1EA', ACC = ['#F24333', '#2F6BF0', '#F4BF3A', '#33AC66'];
$('#cta').textContent = P.cta; $('#link').textContent = P.link;

// the lines in order: q1, a1, q2, a2 ... ; answers take their pair's accent color
const ITEMS = P.pairs.flatMap(([q, a], k) => [{ html: q, col: CREAM }, { html: a, col: ACC[k % 4] }]);

// rectangle while the words play, the mark at the end (mark box 22..98 of 120, drawn 2.5x, centred on 540,860)
// a squashed, wide version of the mark with the same open corner (Graham, 2026-11-03)
const RECT = { x: 70, y: 640, w: 940, h: 520, r: 40, sw: 20 };   // line as thick as the logo's (Graham, 2026-11-03)
const MS = 2.5, MARK = { x: 540 - 38 * MS, y: 860 - 38 * MS, w: 76 * MS, h: 76 * MS, r: 14 * MS, sw: 8 * MS };
const GT = 0.316, GR = 0.342;   // the mark's open corner: 24/76 of the top edge, 26/76 of the right edge

// closed rounded rect starting where the mark's top line ends, running counter-clockwise back to it,
// so a dash that leaves out the last stretch opens the top-right corner exactly like the logo
function framePath(b) {
  const { x, y, w, h, r } = b, x1 = x + w, y1 = y + h, sx = x1 - GT * Math.min(w, h);
  return `M${sx} ${y} H${x + r} A${r} ${r} 0 0 0 ${x} ${y + r} V${y1 - r} A${r} ${r} 0 0 0 ${x + r} ${y1} H${x1 - r} A${r} ${r} 0 0 0 ${x1} ${y1 - r} V${y + r} A${r} ${r} 0 0 0 ${x1 - r} ${y} H${sx}`;
}
// the open corner is the same size on the top and the side, like the logo, however wide the frame (Graham, 2026-11-03)
const gapLen = b => (GR * Math.min(b.w, b.h) - b.r) + Math.PI * b.r / 2 + (GT * Math.min(b.w, b.h) - b.r);
const mix = (a, b, k) => Object.fromEntries(Object.keys(a).map(n => [n, lerp(a[n], b[n], k)]));

// timing
const S0 = 0.9, SWEEP = 0.62, HOLD = [1.05, 1.25];   // hold after a question, after an answer
const starts = []; let tt = S0;
ITEMS.forEach((it, i) => { starts.push(tt); tt += SWEEP + HOLD[i % 2]; });
const END = tt, SHRINK = 0.7, DUR = END + SHRINK + 2.2;

const TW = 600;   // text box, centred in the frame; the sparkle only shows while it sweeps (Graham, 2026-11-03: "adjust the font size so it fits")
function fit(el) {   // shrink a line until it fits on 2 lines, every word inside the box
  let f = 96; el.style.fontSize = f + 'px';
  const over = () => el.offsetHeight > 2 * f * 1.02 + 2 || el.scrollWidth > TW + 1;
  while (over() && f > 48) { f -= 2; el.style.fontSize = f + 'px'; }
}
function show(el, item, clip) {
  el.style.display = 'block';   // visible before measuring, or it measures 0 and never shrinks
  el.innerHTML = item.html; el.style.color = item.col; fit(el);
  el.style.clipPath = clip;
}

window.SCENE = {
  dur: DUR, ready: false,
  seek(t) {
    const fr = $('#frame'), sp = $('#spark'), t0 = $('#t0'), t1 = $('#t1');
    t0.style.display = t1.style.display = 'none'; t0.style.top = t1.style.top = (RECT.y + RECT.h / 2) + 'px';
    let box = RECT, gap = 1, draw = 1, spark = null;   // the corner stays open the whole time
    // the sparkle stays inside the frame, never on or past the line (Graham, 2026-11-03)
    const midY = RECT.y + RECT.h / 2, IN = 95, L = RECT.x + IN, R = RECT.x + RECT.w - IN;

    if (t < S0) {
      // the rectangle draws on, the sparkle pops in on the left edge
      draw = prog(t, 0, 0.6, 'inOutCubic');
      spark = { x: L, y: midY, s: 1.1 * E.outBack(prog(t, 0.45, 0.8)), rot: 0, col: ACC[0] };
    } else if (t < END) {
      let i = 0; while (i + 1 < starts.length && t >= starts[i + 1]) i++;
      const ltr = i % 2 === 0;                          // questions sweep left to right, answers back
      const k = prog(t, starts[i], starts[i] + SWEEP, 'inOutCubic');
      const x = ltr ? lerp(L, R, k) : lerp(R, L, k);
      // new line shows on the side the sparkle has passed, the old one on the side it hasn't reached
      const lx = x - (540 - TW / 2);   // clip-path insets are in the text box's own coordinates
      const newClip = ltr ? `inset(-50px ${TW - lx}px -50px -50px)` : `inset(-50px -50px -50px ${lx}px)`;
      const oldClip = ltr ? `inset(-50px -50px -50px ${lx}px)` : `inset(-50px ${TW - lx}px -50px -50px)`;
      show(t1, ITEMS[i], k >= 1 ? 'none' : newClip);
      if (i > 0 && k < 1) show(t0, ITEMS[i - 1], oldClip);
      // the sparkle pops in for the sweep and out once it is done, so the words sit alone, centred
      // (Graham, 2026-11-03: "centered aligned never left aligned")
      const sIn = E.outBack(prog(t, starts[i], starts[i] + 0.18)), sOut = prog(t, starts[i] + SWEEP, starts[i] + SWEEP + 0.22, 'inOutCubic');
      spark = { x, y: midY, s: 1.1 * sIn * (1 - sOut), rot: (ltr ? 1 : -1) * 180 * k, col: ACC[Math.floor(i / 2) % 4] };
    } else {
      // the last answer clears, the rectangle shrinks into the mark, its corner opens, the sparkle centres
      const k = prog(t, END + 0.12, END + SHRINK, 'outExpo');
      box = mix(RECT, MARK, k);
      const last = ITEMS[ITEMS.length - 1];
      t1.innerHTML = last.html; t1.style.color = last.col; t1.style.clipPath = 'none';
      t1.style.display = 'block'; t1.style.opacity = 1 - prog(t, END, END + 0.12);
      spark = { x: 540, y: lerp(midY, 860, k), s: 0.42 * MS * E.outBack(prog(t, END + 0.3, END + SHRINK + 0.2)), rot: 90 * k, col: k > 0.6 ? CREAM : ACC[(P.pairs.length - 1) % 4] };
      css($('#cta'), { opacity: prog(t, END + SHRINK, END + SHRINK + 0.35), transform: `translateY(${lerp(20, 0, prog(t, END + SHRINK, END + SHRINK + 0.5, 'outExpo'))}px)` });
      css($('#link'), { opacity: 0.6 * prog(t, END + SHRINK + 0.25, END + SHRINK + 0.6) });
    }
    if (t < END) { css($('#cta'), { opacity: 0 }); css($('#link'), { opacity: 0 }); t1.style.opacity = 1; }

    const d = framePath(box); fr.setAttribute('d', d); fr.setAttribute('stroke-width', box.sw);
    const len = fr.getTotalLength(), vis = (len - gapLen(box) * gap) * draw;
    fr.setAttribute('stroke-dasharray', `${vis} ${len * 2}`);
    if (spark && spark.s > 0.01) {
      sp.style.display = 'block'; sp.setAttribute('fill', spark.col);
      sp.setAttribute('transform', `translate(${spark.x} ${spark.y}) rotate(${spark.rot}) scale(${spark.s})`);
    } else sp.style.display = 'none';
  },
};
Promise.all(['700 96px Fr', '600 30px In'].map(f => document.fonts.load(f))).then(() => { SCENE.ready = true; SCENE.seek(0); });
</script>
</body></html>
